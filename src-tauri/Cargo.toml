[package]
name = "repo-prism"
version.workspace = true
description = "RepoPrism — read-only repo intelligence"
authors = ["RepoPrism Contributors"]
edition = "2021"

[lib]
name = "repo_prism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 定位用户配置目录，用于持久化 AI 设置（TASK-013）。
dirs = "5"
repo-prism-core = { path = "../crates/repo-prism-core" }
