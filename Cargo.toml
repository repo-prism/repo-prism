[workspace]
resolver = "2"
members = [
    "crates/repo-prism-core",
    "crates/repo-prism-cli",
    "crates/repo-prism-mcp",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/repo-prism/repo-prism"
authors = ["RepoPrism Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"