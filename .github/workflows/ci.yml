name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  read-only-guard:
    name: Read-only Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 先自检扫描器本身（正例不误报、反例能检出），再扫描真实代码。
      # 旧实现只检查与 Command::new 同一行的内容，对跨行的链式 .arg()
      # 和数组字面量里的命令完全无效，是假绿灯。详见脚本内注释。
      - name: Self-test the guard
        run: bash scripts/read-only-guard.sh --self-test
      - name: Scan for forbidden Git commands
        run: bash scripts/read-only-guard.sh

  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: test
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test